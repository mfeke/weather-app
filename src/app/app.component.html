<div class="container py-3">
    <div class="d-flex " class="epunda-slab">

        <h1><span [innerHTML]="title"></span> CAPE TOWN</h1>
    </div>
</div>

<div class="d-flex over">
    <div class="temp">
        <div class="temp border-top p-4 border-black  border-end border-bottom">
            <div class="d-flex justify-content-between align-items-center">
                <p class=" mb-1 font">Temperature</p>

                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                    fill="currentColor" class="bi bi-arrow-right"
                    viewBox="0 0 16 16">
                    <path fill-rule="evenodd"
                        d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8" />
                </svg>
            </div>
            <div class="d-flex h-100 justify-content-start py-3">
                <p class="text h1 epunda-slab text-center"> 17&deg;</p>
                <!-- <div class="bor ">

                </div> -->
            </div>
            <p class=" span">Feels like -20&deg;</p>
            <div class="d-flex justify-content-between">
                <p class="span mb-0">Max -23&deg;</p>
                <p class="span mb-0">Min -90&deg;</p>
            </div>

        </div>
    </div>
    <div class="wind">
        <div class="wind border-top p-4 border-black  border-end border-bottom">
            <div class="d-flex justify-content-between align-items-center">
                <p class=" mb-1 font">Wind</p>

                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                    fill="currentColor" class="bi bi-arrow-right"
                    viewBox="0 0 16 16">
                    <path fill-rule="evenodd"
                        d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8" />
                </svg>
            </div>
            <div class="d-flex h-100 justify-content-start py-3">
                <p class="text h1 epunda-slab text-center"> 3 <span class="text">m/s</span></p>
                <!-- <div class="bor ">

                </div> -->
            </div>
        </div>
    </div>
</div>
